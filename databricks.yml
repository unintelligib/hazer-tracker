# Databricks Asset Bundle: deploy with `databricks bundle deploy -t dev`.
# Set your workspace host once with `databricks auth login --host <your-workspace-url>`.
bundle:
  name: hazer-tracker
variables:
  alert_email:
    description: Address that receives job failure emails

targets:
  dev:
    default: true
    workspace:
      # host: https://<your-workspace>.cloud.databricks.com   # or rely on your CLI profile

resources:
  jobs:
    bronze_ingest_hourly:
      name: hazer-bronze-ingest-hourly
      # Minute 20 so both feeds are published: PM2.5 showed updatedTimestamp ~:15 past the hour.
      schedule:
        quartz_cron_expression: "0 20 * * * ?"
        timezone_id: Asia/Singapore
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      timeout_seconds: 600
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tasks:
        - task_key: ingest
          # No cluster block: runs on serverless compute (the only option on Free Edition).
          notebook_task:
            notebook_path: ./notebooks/01_bronze_ingest.py
            base_parameters:
              catalog: workspace
              schema: hazer

        - task_key: silver
          depends_on:
            - task_key: ingest
          # Run even if ingest failed: it still saved its ok=false rows, and silver
          # should process whatever did land.
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ./notebooks/02_silver_transform.py
            base_parameters:
              catalog: workspace
              schema: hazer
              full_refresh: "false"
        
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold_transform.py
            base_parameters:
              catalog: workspace
              schema: hazer

include:
  - resources/*.yml